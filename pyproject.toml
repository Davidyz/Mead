[project]
name = "mead"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Davidyz", email = "hzjlyz@gmail.com" }]
requires-python = ">=3.15"
dependencies = ["httpx>=0.28.1", "mcp>=2.3.0", "python-frontmatter>=1.3.0"]

[project.scripts]
mead = "mead:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.93",
]
