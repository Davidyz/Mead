[package]
name = "mead"
publish = false
version = "0.1.0"
edition = "2024"
authors = ["Davidyz <hzjlyz@gmail.com>"]
description = ""

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
lyquid = { version = "0.8.0", features = ["ldk"] }
markdown-frontmatter = { version = "0.5.1", default-features = false, features = ["yaml"] }
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
lyquid-test = { version = "0.8.0" }

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
strip = "debuginfo"
debug = false

[workspace]
