name: "Rust Formatting, Linting and Tests"
on:
  push:
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "Makefile"
      - "scripts/**"
      - ".github/workflows/checks.yml"

jobs:
  ci:
    name: Rust Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environments
        uses: ./.github/actions/prepare/

      - name: Rustfmt Check
        uses: actions-rust-lang/rustfmt@v1

      - name: Run shaker tests
        run: shaker test Cargo.toml
