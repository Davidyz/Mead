name: "Linting and Tests"
on:
  push:

jobs:
  ci:
    name: Linting and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environments
        uses: ./.github/actions/prepare/

      - name: Rustfmt Check
        uses: actions-rust-lang/rustfmt@v1

      - name: Run shaker tests
        run: |
          make prepare
          shaker test Cargo.toml
