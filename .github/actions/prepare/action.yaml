name: "Prepare CI Environments"
description: "Prepare LDK and Python environments."

runs:
  using: "composite"
  steps:
    # Ensure rustfmt is installed and setup problem matcher
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: rustfmt

    - uses: astral-sh/setup-uv@v6

    - run: uv sync --group dev
      shell: bash

    - name: Install LDK
      run: |
        curl ldk.lyquor.dev -L | bash
        echo "$HOME/.shakenup/bin/" >> $GITHUB_PATH
        cargo fetch
      shell: bash

    - name: Check lyquid crate version matches LDK version
      run: |
        cargo info lyquid
        make check-ldk
      shell: bash

    - name: Start lyquor network
      run: docker compose -f ~/.shakenup/ldk/docker/multi/docker-compose.yaml up -d
      shell: bash

    - name: Pull skills and build the fixture
      run: make prepare
      shell: bash
